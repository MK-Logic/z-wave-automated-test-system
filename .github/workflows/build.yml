# YAML -*- mode: yaml; tab-width: 2; indent-tabs-mode: nil; coding: utf-8 -*-
# SPDX-License-Identifier: BSD-3-Clause
# SPDX-FileCopyrightText: 2024 Z-Wave Alliance
# Demo copied from https://docs.github.com/en/actions/quickstart
---
name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: >
          echo "🎉 The job was automatically triggered"
          "by a ${{ github.event_name }} event."
      - run: >
          echo "🐧 This job is now running on a ${{ runner.os }} server"
          "hosted by GitHub!"
      - run: >
          echo "🔎 The name of your branch is ${{ github.ref }}"
          "and your repository is ${{ github.repository }}."
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{  env.debian_packages }}
        env:
          debian_packages: reuse yamllint
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: >
          echo "💡 The ${{ github.repository }} repository"
          "has been cloned to the runner."
      - run: >
          echo "🖥️The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - name: Legal check
        run: reuse lint
      - name: Linter check
        run: find . -iname "*.yml" -exec yamllint "{}" \;
      - run: echo "🍏 This job's status is ${{ job.status }}."
